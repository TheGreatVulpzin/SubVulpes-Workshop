[plugin]
id=sv.bans
name=Bans
version=0.1.1
library=bans.dll
api=1
live=1
capabilities=read,write,storage,config,plugins
description=Bans that last after a restart, and kicks that let the player join again.
author=Vulpzin
license=GPL-3.0-only

[setting.ban_address]
type=flag
default=1
label=Ban the address too
help=Also refuse the address of a banned player. Players on one shared address are banned together.
live=1

[setting.default_days]
type=int
default=0
min=0
max=3650
label=Default ban length in days
help=Used when /ban has no time. 0 means a ban with no end.
live=1
